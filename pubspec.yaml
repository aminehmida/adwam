name: adwam
description: "Daily adhkar app — principled default ordering, per-context customization."
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.8
  vibration: ^3.2.0
  adhan_dart: ^2.0.1
  flutter_timezone: ^5.1.0
  wakelock_plus: ^1.7.0
  sherpa_onnx: ^1.13.4
  record: ^7.1.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  convert: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  wakelock_plus_platform_interface: ^1.6.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B3B32"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/adhkar.json
    # Generated by tool/build_zones.py from the tz database's zone.tab.
    - assets/zones.json
    # Silero VAD (MIT), which cuts the microphone stream into utterances.
    # Small enough to ship; the speech model itself is downloaded on demand.
    - assets/voice/silero_vad.onnx

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    # Quran-specific cut of Amiri (same authors, SIL OFL): tashkeel and waqf
    # marks are positioned tightly over their letters for mushaf typesetting.
    # Used only for Quranic passages/surahs.
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
